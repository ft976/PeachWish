		<!-- Full-screen Lightbox Modal Overlay for Image Tapping -->
		<div id="image-lightbox" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(22, 17, 16, 0.95); z-index: 30000; align-items: center; justify-content: center; flex-direction: column; padding: 24px; transition: all 0.25s ease; opacity: 0;">

			<!-- Image frame mimicking pristine professional photography gallery border -->
			<div style="max-width: 90%; max-height: 75vh; display: flex; align-items: center; justify-content: center; border: 12px solid #ffffff; background: #ffffff; border-radius: 4px; box-shadow: 0 25px 60px rgba(0,0,0,0.45); overflow: hidden; margin-bottom: 20px;" class="lightbox-open-animation">

			<!-- Caption tag below image inside lightbox -->
			<p id="lightbox-caption" style="font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 600; font-style: italic; color: #FFF9F6; text-align: center; max-width: 650px; padding: 0 15px; margin: 0; line-height: 1.5; text-shadow: 0 2px 4px rgba(0,0,0,0.5);"></p>
		</div>

		<script>
			// Extract URL parameters
			const urlParams = new URLSearchParams(window.location.search);
			const id = urlParams.get('id');

			function renderWish(name, messageLines) {
				if (name) {
					document.title = "A Special Surprise For " + name + " 💖";
				}
				let html = '<p>' + name + ',</p>';
				messageLines.forEach(function(line) {
					if (line.trim() !== '') {
						html += '<p>' + line + '</p>';
					}
				});
				html += '<p>Happy Birthday ' + name + '! 🎂🌹</p>';
				document.querySelector('#dynamic-message-container .col-md-12').innerHTML = html;
			}

			function showExpiredScreen() {
				document.getElementById('expired-overlay').style.display = 'flex';
				// Hide normal page structure
				const container = document.querySelector('.container');
				if (container) container.style.display = 'none';
				const nav = document.querySelector('.navbar-fixed-bottom');
				if (nav) nav.style.display = 'none';
				// Stop and hide song
				const song = document.querySelector('.song');
				if (song) {
					song.pause();
					song.src = "";
				}
			}

			window.albumData = null;

			function openLightbox(url, caption) {
				const lightbox = document.getElementById('image-lightbox');
				const img = document.getElementById('lightbox-img');
				const cap = document.getElementById('lightbox-caption');
				if (!lightbox || !img || !cap) return;
				
				img.src = url;
				cap.textContent = caption || '';
				lightbox.style.display = 'flex';
				// Trigger reflow for transition
				lightbox.offsetHeight;
				lightbox.style.opacity = '1';
			}

			function closeLightbox() {
				const lightbox = document.getElementById('image-lightbox');
				if (!lightbox) return;
				lightbox.style.opacity = '0';
				setTimeout(function() {
					lightbox.style.display = 'none';
				}, 250);
			}

			function populateAlbum(album) {
				const grid = document.getElementById('memories-grid');
				if (!grid) return;
				grid.innerHTML = '';
				
				// Exquisite reusable SVG watercolor rose corner gradient definition
				const roseSvgMarkup = `
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
						<defs>
							<radialGradient id="rg1" cx="50%" cy="50%" r="50%">
								<stop offset="0%" stop-color="%23FFB3A7"/>
								<stop offset="75%" stop-color="%23FF8A71"/>
								<stop offset="100%" stop-color="%23FF6B4E" stop-opacity="0"/>
							</radialGradient>
							<radialGradient id="rg2" cx="40%" cy="40%" r="60%">
								<stop offset="0%" stop-color="%23FFE4D9"/>
								<stop offset="50%" stop-color="%23FFB3A7"/>
								<stop offset="100%" stop-color="%23FF8A71"/>
							</radialGradient>
						</defs>
						<g opacity="0.95">
							<path d="M100,0 Q65,15 50,50 Q35,85 0,100" fill="none" stroke="%238cb07c" stroke-width="2.5"/>
							<path d="M82,15 C68,5 58,25 72,30 C86,35 90,15 82,15 Z" fill="%237ba36a" opacity="0.85"/>
							<path d="M45,45 C35,35 25,55 35,60 C45,65 52,45 45,45 Z" fill="%238cb07c" opacity="0.85"/>
							<circle cx="80" cy="20" r="15" fill="url(%23rg2)"/>
							<circle cx="82" cy="18" r="10" fill="url(%23rg1)"/>
							<circle cx="52" cy="45" r="11" fill="url(%23rg2)"/>
							<circle cx="54" cy="43" r="7" fill="url(%23rg1)"/>
						</g>
					</svg>
				`.trim().replace(/"/g, '&quot;').replace(/</g, '%3C').replace(/>/g, '%3E');

				album.forEach(function(moment, idx) {
					const col = document.createElement('div');
					col.className = 'col-md-6 col-sm-6';
					
					// Apply different default rotation offsets for a messy scrapbook look
					const rot = (idx % 2 === 0) ? (idx * 1.3 - 2) : (idx * 0.9 + 1.5);
					
					col.innerHTML = `
						<div class="polaroid-card animate-polaroid" style="transform: rotate(${rot}deg); margin-bottom: 35px; background: #ffffff; padding: 22px 20px 32px 20px; box-shadow: 0 12px 35px rgba(255, 138, 113, 0.12); border: 1.5px solid #FFD8CC; border-radius: 4px; transition: all 0.3s ease; position: relative; overflow: hidden;">
							
							<!-- Charming taped rose decorative sticker at top center -->
							<div style="position: absolute; top: -2px; left: 50%; transform: translateX(-50%); background: #FFE4D9; border: 1px dashed #FFBCA7; padding: 2px 14px; border-radius: 3px; font-family: 'Signika', sans-serif; font-size: 11px; font-weight: bold; color: #FF7A59; z-index: 10; display: flex; align-items: center; gap: 4px; box-shadow: 0 2px 6px rgba(255,138,113,0.15);">
								🌹 memory
							</div>

							<!-- Exquisite Watercolor Rose Corner Borders framing each photo dynamically on all 4 corners -->
							<div class="polaroid-image-wrapper" style="width: 100%; aspect-ratio: 4 / 3; background: #FFF9F6; overflow: hidden; border: 1.5px solid #FAD2C4; margin-top: 10px; margin-bottom: 15px; position: relative; border-radius: 2px;">
								<img src="${moment.imageUrl}" alt="Memory ${idx + 1}" style="width:100%; height:100%; object-fit:cover;" />
								
								<!-- Top Left Rose Corner -->
								<div style="position: absolute; top: -2px; left: -2px; width: 44px; height: 44px; pointer-events: none; z-index: 5; transform: rotate(270deg); background-image: url('data:image/svg+xml;utf8,${roseSvgMarkup}'); background-size: contain; background-repeat: no-repeat; background-position: top right;"></div>
								
								<!-- Top Right Rose Corner -->
								<div style="position: absolute; top: -2px; right: -2px; width: 44px; height: 44px; pointer-events: none; z-index: 5; transform: rotate(0deg); background-image: url('data:image/svg+xml;utf8,${roseSvgMarkup}'); background-size: contain; background-repeat: no-repeat; background-position: top right;"></div>
								
								<!-- Bottom Left Rose Corner -->
								<div style="position: absolute; bottom: -2px; left: -2px; width: 44px; height: 44px; pointer-events: none; z-index: 5; transform: rotate(180deg); background-image: url('data:image/svg+xml;utf8,${roseSvgMarkup}'); background-size: contain; background-repeat: no-repeat; background-position: top right;"></div>
								
								<!-- Bottom Right Rose Corner -->
								<div style="position: absolute; bottom: -2px; right: -2px; width: 44px; height: 44px; pointer-events: none; z-index: 5; transform: rotate(90deg); background-image: url('data:image/svg+xml;utf8,${roseSvgMarkup}'); background-size: contain; background-repeat: no-repeat; background-position: top right;"></div>
							</div>

							<div class="polaroid-caption" style="font-family: 'Playfair Display', serif; font-size: 15px; font-style: italic; font-weight: 700; color: #5C4B47; text-align: center; line-height: 1.5; padding: 0 5px;">
								${moment.caption || ''}
							</div>
						</div>
					`;
					
					// Bind tap/click to open image zoom lightbox
					const card = col.querySelector('.polaroid-card');
					if (card) {
						card.addEventListener('click', function() {
							openLightbox(moment.imageUrl, moment.caption);
						});
					}
					
					grid.appendChild(col);
				});
			}

			// Listeners for the memory buttons
			document.addEventListener('DOMContentLoaded', function() {
				const openBtn = document.getElementById('open-memories-btn');
				const closeBtn = document.getElementById('close-memories-btn');
				const closeBtnFloating = document.getElementById('close-memories-btn-floating');
				const overlay = document.getElementById('memories-album-overlay');
				
				const lightbox = document.getElementById('image-lightbox');
				const closeLightboxBtn = document.getElementById('close-lightbox-btn');
				
				function closeAlbumBook() {
					if (overlay) {
						overlay.style.display = 'none';
						document.body.style.overflow = 'auto'; // restore scroll
					}
				}

				if (openBtn && overlay) {
					openBtn.addEventListener('click', function() {
						overlay.style.display = 'block';
						document.body.style.overflow = 'hidden'; // prevent scrolling behind the book
					});
				}
				
				// Wire both regular close button and top floating close button
				if (closeBtn) {
					closeBtn.addEventListener('click', closeAlbumBook);
				}
				if (closeBtnFloating) {
					closeBtnFloating.addEventListener('click', closeAlbumBook);
				}
				
				// Close lightbox on background or cross button click
				if (lightbox) {
					lightbox.addEventListener('click', function(e) {
						if (e.target === lightbox || e.target === closeLightboxBtn || e.target.id === 'close-lightbox-btn') {
							closeLightbox();
						}
					});
				}
				if (closeLightboxBtn) {
					closeLightboxBtn.addEventListener('click', closeLightbox);
				}
			});

			if (id) {
				// Secure Dynamic Look-up and state check
				fetch('/api/wishes/check?id=' + encodeURIComponent(id))
					.then(response => {
						if (!response.ok) {
							throw new Error('Network error checking wish');
						}
						return response.json();
					})
					.then(data => {
						if (data.valid) {
							const lines = data.message.split('\n');
							renderWish(data.name, lines);
							if (data.album && data.album.length > 0) {
								window.albumData = data.album;
								populateAlbum(data.album);
								document.getElementById('memories-cta-container').style.display = 'none';
							} else {
								window.albumData = null;
								const cta = document.getElementById('memories-cta-container');
								if (cta) cta.style.setProperty('display', 'none', 'important');
							}
						} else {
							showExpiredScreen();
						}
					})
					.catch(err => {
						console.error("API error checking wish", err);
						showExpiredScreen();
					});
			} else {
				// Fallback to legacy encoded URL values for full backwards compatibility
				let encodedName = urlParams.get('n');
				let encodedMessage = urlParams.get('m');
				let expiry = urlParams.get('e');
				let timestamp = urlParams.get('t');

				// Check legacy client-side expiry
				if (expiry && timestamp) {
					const ts = parseInt(timestamp, 10);
					let duration = 0;
					if (expiry === '1h') duration = 60 * 60 * 1000;
					else if (expiry === '3h') duration = 3 * 60 * 60 * 1000;
					else if (expiry === '6h') duration = 6 * 60 * 60 * 1000;
					else if (expiry === '12h') duration = 12 * 60 * 60 * 1000;
					else if (expiry === '24h') duration = 24 * 60 * 60 * 1000;
					else if (expiry === '7d') duration = 7 * 24 * 60 * 60 * 1000;

					if (duration > 0 && Date.now() > ts + duration) {
						showExpiredScreen();
					}
				}

				let customName = "Friend";
				let customMessage = ["Happy Birthday!"];

				try {
					if (encodedName) customName = decodeURIComponent(atob(encodedName));
					if (encodedMessage) customMessage = decodeURIComponent(atob(encodedMessage)).split('\n');
				} catch (e) {
					console.error("Failed to decode parameters", e);
				}

				window.albumData = null;
				const cta = document.getElementById('memories-cta-container');
				if (cta) cta.style.setProperty('display', 'none', 'important');

				renderWish(customName, customMessage);
			}
